<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoC-AI Portal — mockup</title>
  <style>
    :root {
      --bg: #111318;
      --card: #171a21;
      --fg: #f2f4f7;
      --muted: #9aa3b2;
      --line: #2c3340;
      --primary: #0091e6;
      --accent: #1ac6e0;
      --critical: #f05252;
      --high: #f27a1a;
      --medium: #e6b325;
      --low: #3cba54;
      --ok: #3cba54;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(600px 280px at 50% 0%, rgba(0, 145, 230, 0.18), transparent 70%),
        var(--bg);
    }
    .auth-card {
      width: min(420px, calc(100% - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
      font-size: 22px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input, select, textarea {
      width: 100%;
      background: #12151b;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    textarea { min-height: 88px; resize: vertical; }
    .primary, .ghost, .tiny {
      border-radius: 10px;
      border: 1px solid transparent;
      padding: 10px 14px;
    }
    .primary { background: var(--primary); color: #041018; font-weight: 650; }
    .ghost, .tiny { background: transparent; border-color: var(--line); }
    .tiny { padding: 6px 10px; font-size: 13px; }
    .primary:disabled { opacity: 0.5; }
    .error { color: var(--critical); font-size: 13px; min-height: 18px; }
    .hint { color: var(--muted); font-size: 13px; }
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 14px 22px;
      background: rgba(23, 26, 33, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--accent);
    }
    .search-wrap { position: relative; width: 320px; }
    .search-wrap input { padding-left: 12px; }
    .hits {
      position: absolute;
      top: 44px;
      left: 0;
      width: 320px;
      background: #1c212b;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
      max-height: 280px;
      overflow: auto;
    }
    .hits button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .hits button:hover { background: #243041; }
    .who { font-size: 13px; }
    .who span { display: block; color: var(--muted); }
    .layout { display: flex; min-height: calc(100vh - 65px); }
    aside {
      width: 240px;
      flex: none;
      border-right: 1px solid var(--line);
      background: #14181f;
      padding: 16px 12px;
    }
    nav button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    nav button.active { background: #243041; }
    .badge {
      min-width: 22px;
      text-align: center;
      border-radius: 999px;
      background: var(--critical);
      color: white;
      font-size: 12px;
      padding: 1px 6px;
    }
    .badge.quiet { background: #2c3644; }
    main { flex: 1; padding: 22px; }
    h2 { margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card.sev-critical { border-left: 4px solid var(--critical); }
    .card.sev-high { border-left: 4px solid var(--high); }
    .card.sev-medium { border-left: 4px solid var(--medium); }
    .card.sev-low { border-left: 4px solid var(--low); }
    .tag {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      letter-spacing: 0.04em;
      margin-right: 6px;
    }
    .tag.critical { background: rgba(240, 82, 82, 0.2); color: #ffb4b4; }
    .tag.high { background: rgba(242, 122, 26, 0.2); color: #ffc59a; }
    .tag.medium { background: rgba(230, 179, 37, 0.2); color: #ffe29a; }
    .tag.low { background: rgba(60, 186, 84, 0.2); color: #b6efc2; }
    .tag.plain { background: #243041; color: var(--muted); }
    .meta { color: var(--muted); font-size: 13px; margin: 6px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .stat b { font-size: 28px; display: block; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .bar { height: 6px; background: #2c3340; border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .bar span { display: block; height: 100%; background: var(--primary); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: grid;
      place-items: center;
      z-index: 20;
    }
    .modal {
      width: min(720px, calc(100% - 32px));
      max-height: min(80vh, 760px);
      overflow: auto;
      background: #1b2029;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }
    .bubble { padding: 10px 12px; border-radius: 12px; margin: 8px 0; }
    .bubble.user { background: #243041; }
    .bubble.assistant { background: #14202b; border: 1px solid #1d3c52; }
    .path { color: var(--accent); font-size: 12px; }
    svg.graph { width: 100%; height: 280px; background: #12151b; border-radius: 12px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button[aria-selected="true"] { background: #243041; }
    @media (max-width: 900px) {
      .layout { display: block; }
      aside { width: auto; }
      .split, .search-wrap, .search-wrap input, .hits { width: 100%; }
      header.app-header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const analysts = ["Alex Rivera", "Jordan Lee", "Priya Shah", "Morgan Chen"];
    const alerts = [
      { id: "a1", title: "Finance workstation beacon to Ledger Fox", severity: "critical", status: "open", source: "EDR System", type: "Beacon", assignee: "Priya Shah", age: "15 minutes ago", text: "WS-FINANCE-01 beacons every five minutes to 185.220.101.182 after a user opened the Ledger Fox invoice.", incident: "i5" },
      { id: "a2", title: "Suspicious Network Traffic Detected", severity: "high", status: "investigating", source: "Network IDS", type: "Network Anomaly", assignee: "Alex Rivera", age: "25 minutes ago", text: "Multiple connections from 192.168.1.100 on WS-FINANCE-01 to 185.220.101.182 started after the Ledger Fox invoice mail was acknowledged.", incident: "i5" },
      { id: "a3", title: "Phishing Email Campaign", severity: "high", status: "acknowledged", source: "Email Security", type: "Phishing", assignee: "Jordan Lee", age: "45 minutes ago", text: "billing@pay-ledger.example sent a Ledger Fox invoice with a malicious attachment to MAIL-SERVER-01.", incident: "i5" },
      { id: "a4", title: "VPN sign-in from an unusual country", severity: "medium", status: "open", source: "VPN Gateway", type: "Authentication Anomaly", assignee: "Unassigned", age: "70 minutes ago", text: "A user VPN session started from an unusual country and is waiting for the account owner to confirm travel.", incident: null },
      { id: "a5", title: "Failed Login Attempts", severity: "medium", status: "acknowledged", source: "Domain Controller", type: "Authentication Anomaly", assignee: "Alex Rivera", age: "90 minutes ago", text: "Multiple failed login attempts for the administrator account from 203.0.113.42 against DC-PRIMARY.", incident: "i8" },
      { id: "a6", title: "Encoded PowerShell on finance workstation", severity: "high", status: "investigating", source: "EDR System", type: "PowerShell", assignee: "Alex Rivera", age: "2 hours ago", text: "PowerShell ran with an encoded command on WS-FINANCE-03 and opened an outbound connection. No second address is confirmed.", incident: "i1" },
      { id: "a7", title: "USB storage policy violation", severity: "low", status: "open", source: "Endpoint DLP", type: "Policy Violation", assignee: "Unassigned", age: "3 hours ago", text: "A removable drive was mounted on WS-HR-12 outside the allowed device list.", incident: "i6" },
      { id: "a8", title: "Malware Detection on Endpoint", severity: "critical", status: "resolved", source: "EDR System", type: "Malware Detection", assignee: "Jordan Lee", age: "3 hours ago", text: "Trojan.Win32.Agent was detected and quarantined on WS-USER-045.", incident: "i7" },
      { id: "a9", title: "Large outbound transfer from finance", severity: "critical", status: "open", source: "Network IDS", type: "Data Exfiltration", assignee: "Priya Shah", age: "5 hours ago", text: "WS-FINANCE-02 sent 2.4 GB to an external host during off hours. This transfer is separate from the Ledger Fox beacon.", incident: "i2" },
      { id: "a10", title: "Payroll phishing mail", severity: "high", status: "investigating", source: "Email Security", type: "Phishing", assignee: "Jordan Lee", age: "8 hours ago", text: "A lookalike payroll portal was reported by two employees. It is not the Ledger Fox invoice.", incident: "i3" },
      { id: "a11", title: "DDoS Attack Detected", severity: "critical", status: "resolved", source: "WAF", type: "DDoS", assignee: "Morgan Chen", age: "1 day ago", text: "Volumetric DDoS from 45.142.214.48 targeting WEB-CLUSTER has subsided.", incident: "i4" },
      { id: "a12", title: "Scanner flagged a signed installer", severity: "medium", status: "false_positive", source: "EDR System", type: "Malware Detection", assignee: "Jordan Lee", age: "2 days ago", text: "The nightly software catalog installer matched a malware heuristic and was marked a false positive after hash review.", incident: "i7" }
    ];
    const incidents = [
      { id: "i5", title: "Ledger Fox intrusion across finance hosts", severity: "critical", status: "investigating", assignee: "Priya Shah", tags: ["ledger-fox", "campaign", "beacon"], text: "Finance users received a Ledger Fox invoice, then WS-FINANCE-01 started beaconing to 185.220.101.182." },
      { id: "i8", title: "Administrator brute force against the domain controller", severity: "medium", status: "investigating", assignee: "Jordan Lee", tags: ["brute-force", "authentication"], text: "Repeated failures for the administrator account came from 203.0.113.42." },
      { id: "i1", title: "Suspicious PowerShell Execution Detected", severity: "high", status: "investigating", assignee: "Alex Rivera", tags: ["powershell", "malware"], text: "Encoded PowerShell on WS-FINANCE-03 opened an outbound connection. No second host is confirmed." },
      { id: "i6", title: "USB storage policy violation", severity: "low", status: "open", assignee: "Unassigned", tags: ["usb", "policy"], text: "A removable drive was mounted on WS-HR-12 outside the allowed device list." },
      { id: "i2", title: "Data Exfiltration Attempt", severity: "critical", status: "open", assignee: "Priya Shah", tags: ["data-exfiltration", "finance"], text: "WS-FINANCE-02 sent 2.4 GB to an external host during off hours." },
      { id: "i3", title: "Payroll phishing against employee mailboxes", severity: "high", status: "investigating", assignee: "Jordan Lee", tags: ["phishing", "payroll"], text: "A lookalike payroll portal was reported by two employees. It is not the Ledger Fox invoice." },
      { id: "i4", title: "Volumetric DDoS against the web cluster", severity: "critical", status: "resolved", assignee: "Morgan Chen", tags: ["ddos", "botnet"], text: "Sustained traffic from 45.142.214.48 saturated WEB-CLUSTER. Rate limits held." },
      { id: "i7", title: "Signed installer marked as a false positive", severity: "medium", status: "closed", assignee: "Jordan Lee", tags: ["false-positive", "installer"], text: "Hash review closed the catalog installer case as a false positive." }
    ];
    const indicators = [
      { value: "Ledger Fox", type: "domain", threat: "Intrusion set", country: "RU", confidence: 96, source: "ThreatFeed Alpha" },
      { value: "185.220.101.182", type: "ip", threat: "Malware C2", country: "RU", confidence: 95, source: "ThreatFeed Alpha" },
      { value: "pay-ledger.example", type: "domain", threat: "Phishing", country: "CN", confidence: 87, source: "Intel Source Beta" },
      { value: "https://pay-ledger.example/invoice", type: "url", threat: "Phishing", country: "CN", confidence: 82, source: "Intel Source Beta" },
      { value: "billing@pay-ledger.example", type: "email", threat: "Phishing", country: "CN", confidence: 76, source: "Email Security" },
      { value: "invoice.iso", type: "file", threat: "Malware Distribution", country: "US", confidence: 70, source: "Email Security" },
      { value: "CVE-2024-21887", type: "file", threat: "Vulnerability", country: "US", confidence: 55, source: "Intel Source Gamma" },
      { value: "45.142.214.48", type: "ip", threat: "DDoS Attack", country: "NL", confidence: 92, source: "ThreatFeed Alpha" },
      { value: "botnet.example", type: "domain", threat: "DDoS Attack", country: "NL", confidence: 88, source: "ThreatFeed Alpha" },
      { value: "203.0.113.42", type: "ip", threat: "Brute Force", country: "KR", confidence: 85, source: "ThreatFeed Alpha" },
      { value: "payroll-secure.example", type: "domain", threat: "Credential Theft", country: "DE", confidence: 64, source: "Intel Source Beta" },
      { value: "198.51.100.23", type: "ip", threat: "Scanning", country: "BR", confidence: 42, source: "Network IDS" },
      { value: "49.36.50.10", type: "ip", threat: "Unusual VPN source", country: "IN", confidence: 38, source: "VPN Gateway" }
    ];
    const comments = [
      { who: "Alex Rivera", role: "Tier 2", type: "note", text: "Outbound sessions from WS-FINANCE-01 to 185.220.101.182 line up with the Ledger Fox invoice. Holding the host for containment review." },
      { who: "Jordan Lee", role: "Tier 1", type: "question", text: "Did the user open the attachment, or only the invoice link?" },
      { who: "Priya Shah", role: "Tier 3", type: "escalation", text: "Escalating to Tier 3. The beacon and this network alert share 185.220.101.182 and WS-FINANCE-01." },
      { who: "Morgan Chen", role: "Management", type: "resolution", text: "Containment is approved for WS-FINANCE-01 once the beacon check finishes." }
    ];
    const kpis = [
      ["Mean Time to Detect", "18.5m", "22.0m", "15.0m", 100, "response time"],
      ["Mean Time to Respond", "2.4h", "3.1h", "2.0h", 100, "response time"],
      ["Total Alerts", "12", "9", "20", 60, "alerts"],
      ["Critical Alerts", "2", "3", "1", 100, "alerts"],
      ["Active Threat Indicators", "14", "11", "10", 100, "threats"],
      ["Open Incidents", "2", "2", "3", 67, "incidents"],
      ["Resolution Rate", "16.7%", "12.5%", "80%", 21, "resolution"],
      ["False Positive Rate", "8.3%", "11.0%", "5%", 100, "performance"]
    ];
    const history = [
      { role: "user", text: "Which finance alerts are still open?" },
      { role: "assistant", text: "From the alert store: the Ledger Fox beacon on WS-FINANCE-01 and the 2.4 GB transfer from WS-FINANCE-02 are open. The PowerShell alert on WS-FINANCE-03 is still under investigation.", path: "Fast path · database" },
      { role: "user", text: "Summarize the phishing alert." },
      { role: "assistant", text: "Email Security acknowledged a high phishing alert. billing@pay-ledger.example sent a Ledger Fox invoice with a malicious attachment to MAIL-SERVER-01.", path: "Fast path · inclusionai/ling-3.0-flash-vl" }
    ];

    const state = {
      authed: false,
      view: "alerts",
      severity: "all",
      query: "",
      searchOpen: false,
      incidentId: null,
      reportRole: "management",
      reportTab: "templates",
      indicatorType: "all",
      country: "all",
      messages: history.slice(),
      draft: "",
      authError: ""
    };

    const active = (alert) => !["resolved", "false_positive"].includes(alert.status);
    const counts = {
      total: alerts.filter(active).length,
      critical: alerts.filter((alert) => active(alert) && alert.severity === "critical").length,
      high: alerts.filter((alert) => active(alert) && alert.severity === "high").length,
      medium: alerts.filter((alert) => active(alert) && alert.severity === "medium").length,
      low: alerts.filter((alert) => active(alert) && alert.severity === "low").length
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    function routeQuestion(text) {
      const deep = /\b(correlat\w*|attribut\w*|campaign|lateral|playbook|root cause|containment|investigat\w*|compare|ambiguous|multi-?stage|kill chain|across|threat report|intelligence report)\b/i;
      const language = /\b(analy[sz]e|explain|summar\w*|recommend\w*|should|draft|assess|mean)\b/i;
      const addresses = text.match(/\b\d{1,3}(?:\.\d{1,3}){3}\b/g) || [];
      if (deep.test(text) || new Set(addresses).size >= 2) {
        return {
          path: "Deep path · anthropic/claude-sonnet-5, openai/gpt-4.1",
          text: "The records support one Ledger Fox campaign: the invoice mail, the sessions from 192.168.1.100 to 185.220.101.182, and the five-minute beacon on WS-FINANCE-01. The 2.4 GB transfer and the PowerShell alert are separate. Confidence: medium. Unknown: whether the attachment was opened.\n\nResponse plan:\nConfirm the mailbox forward, isolate WS-FINANCE-01, and keep the finance transfer as its own incident."
        };
      }
      if (language.test(text)) {
        const hit = alerts.find((alert) => text.toLowerCase().includes("phish") ? /phish/i.test(alert.title) : text.toLowerCase().split(/\s+/).some((word) => word.length > 3 && (alert.title + alert.text).toLowerCase().includes(word)));
        return {
          path: "Fast path · inclusionai/ling-3.0-flash-vl",
          text: hit ? hit.text : "The loaded alert records do not contain an answer to that question."
        };
      }
      const lines = alerts.filter((alert) => text.toLowerCase().split(/\s+/).some((word) => word.length > 2 && (alert.title + alert.text).toLowerCase().includes(word))).slice(0, 3);
      return {
        path: "Fast path · database",
        text: lines.length ? "From the alert store:\n" + lines.map((alert) => "- " + alert.title + " (" + alert.severity + ", " + alert.status + ")").join("\n") : "The alert store has no records that match that question."
      };
    }

    function searchHits() {
      const query = state.query.trim().toLowerCase();
      if (query.length < 2) return [];
      const hits = [];
      alerts.forEach((alert) => {
        if ((alert.title + alert.text + alert.type).toLowerCase().includes(query)) hits.push({ kind: "alert", title: alert.title, detail: alert.severity + " · " + alert.status, view: "alerts" });
      });
      incidents.forEach((incident) => {
        if ((incident.title + incident.text + incident.tags.join(" ")).toLowerCase().includes(query)) hits.push({ kind: "incident", title: incident.title, detail: incident.severity + " · " + incident.status, id: incident.id, view: "incidents" });
      });
      indicators.forEach((indicator) => {
        if ((indicator.value + indicator.threat).toLowerCase().includes(query)) hits.push({ kind: "indicator", title: indicator.value, detail: indicator.threat + " · " + indicator.country, view: "threats" });
      });
      return hits.slice(0, 8);
    }

    function shell(body) {
      const hits = state.searchOpen ? searchHits() : [];
      return `
        <header class="app-header">
          <div class="row"><div class="mark"></div><strong class="brand" style="font-size:20px">SoC-AI Portal</strong><span class="pill">Mockup</span></div>
          <div class="row">
            <div class="search-wrap">
              <input id="search" placeholder="Search alerts, IOCs, incidents..." value="${escapeHtml(state.query)}">
              ${state.searchOpen && state.query.trim().length >= 2 ? `<div class="hits">${hits.length ? hits.map((hit, index) => `<button data-hit="${index}">${escapeHtml(hit.title)}<div class="meta">${escapeHtml(hit.kind)} · ${escapeHtml(hit.detail)}</div></button>`).join("") : `<div class="meta" style="padding:8px 10px">No matches</div>`}</div>` : ""}
            </div>
            <div class="who">ANALYST TIER 2<span>Alex Rivera</span></div>
            <button class="ghost" id="signout">Sign out</button>
          </div>
        </header>
        <div class="layout">
          <aside>
            <nav>
              ${navButton("alerts", "Alert Feed", counts.critical)}
              ${navButton("incidents", "Incidents", incidents.length, true)}
              ${navButton("assistant", "AI Assistant")}
              ${navButton("collaboration", "Collaboration")}
              ${navButton("metrics", "KPI Metrics")}
              ${navButton("threats", "Threat Map")}
              ${navButton("reports", "Reports")}
            </nav>
            <div class="card">
              <strong>Quick stats</strong>
              <div class="meta">Active alerts ${counts.total}</div>
              <div class="meta">Critical ${counts.critical} · High ${counts.high}</div>
              <div class="meta">Medium ${counts.medium} · Low ${counts.low}</div>
            </div>
          </aside>
          <main>${body}</main>
        </div>`;
    }

    function navButton(view, label, count, quiet) {
      const badge = count === undefined ? "" : `<span class="badge ${quiet ? "quiet" : ""}">${count}</span>`;
      return `<button data-view="${view}" class="${state.view === view ? "active" : ""}">${label} ${badge}</button>`;
    }

    function alertsView() {
      const rows = alerts.filter((alert) => state.severity === "all" || alert.severity === state.severity);
      return `
        <div class="row" style="justify-content:space-between"><h2>Alert Feed</h2><button class="ghost">Export feed</button></div>
        <p class="sub">Twelve synthetic alerts. Resolved and false-positive rows stay visible here and drop out of the sidebar counts.</p>
        <div class="toolbar">${["all", "critical", "high", "medium", "low"].map((level) => `<button class="${state.severity === level ? "primary" : "ghost"}" data-severity="${level}">${level[0].toUpperCase() + level.slice(1)}</button>`).join("")}</div>
        ${rows.map((alert) => `
          <article class="card sev-${alert.severity}">
            <div class="row" style="justify-content:space-between">
              <strong>${escapeHtml(alert.title)}</strong>
              <div><span class="tag ${alert.severity}">${alert.severity}</span><span class="tag plain">${alert.status.replace("_", " ")}</span></div>
            </div>
            <div class="meta">${escapeHtml(alert.age)} · ${escapeHtml(alert.source)} · ${escapeHtml(alert.type)}</div>
            <div class="meta">Assigned to: ${escapeHtml(alert.assignee)}</div>
            <p>${escapeHtml(alert.text)}</p>
          </article>`).join("")}`;
    }

    function incidentsView() {
      const query = state.query.trim().toLowerCase();
      const rows = incidents.filter((incident) => !query || (incident.title + incident.text + incident.tags.join(" ")).toLowerCase().includes(query));
      const open = incidents.find((incident) => incident.id === state.incidentId);
      const related = open ? alerts.filter((alert) => alert.incident === open.id) : [];
      return `
        <div class="row" style="justify-content:space-between"><div><h2>Incident Management</h2><p class="sub">Eight incidents cover open, investigating, resolved, and closed.</p></div><button class="ghost">New incident</button></div>
        ${rows.map((incident) => `
          <article class="card sev-${incident.severity}">
            <div class="row" style="justify-content:space-between"><strong>${escapeHtml(incident.title)}</strong><span class="tag ${incident.severity}">${incident.severity}</span></div>
            <div class="meta">${incident.status} · ${escapeHtml(incident.assignee)} · ${alerts.filter((alert) => alert.incident === incident.id).length} alerts</div>
            <p>${escapeHtml(incident.text)}</p>
            <div>${incident.tags.map((tag) => `<span class="tag plain">${escapeHtml(tag)}</span>`).join("")}</div>
            <div class="toolbar" style="margin-top:10px"><button class="tiny" data-incident="${incident.id}">View details</button></div>
          </article>`).join("")}
        ${open ? `<div class="modal-back" id="close-modal"><div class="modal" id="modal-card">
          <div class="row" style="justify-content:space-between"><h2>${escapeHtml(open.title)}</h2><button class="ghost" id="close-detail">Close</button></div>
          <p>${escapeHtml(open.text)}</p>
          <h3>Related alerts</h3>
          <ul>${related.map((alert) => `<li>${alert.severity.toUpperCase()} · ${escapeHtml(alert.title)} · ${alert.status}</li>`).join("") || "<li>None</li>"}</ul>
          <h3>Comments</h3>
          <ul>${open.id === "i5" ? comments.slice(0, 3).map((comment) => `<li><strong>${escapeHtml(comment.who)}</strong> (${comment.type}): ${escapeHtml(comment.text)}</li>`).join("") : "<li>No comments on this incident in the mockup.</li>"}</ul>
        </div></div>` : ""}`;
    }

    function assistantView() {
      return `
        <h2>AI Assistant</h2>
        <p class="sub">This page illustrates the two-tier gate. It does not call OpenRouter. The running app does.</p>
        <div class="card">
          ${state.messages.map((message) => `<div class="bubble ${message.role}"><div>${escapeHtml(message.text).replaceAll("\n", "<br>")}</div>${message.path ? `<div class="path">${escapeHtml(message.path)}</div>` : ""}</div>`).join("")}
          <div class="row">
            <input id="draft" placeholder="Ask about the Ledger Fox campaign or summarize the phishing alert" value="${escapeHtml(state.draft)}">
            <button class="primary" id="send">Send</button>
          </div>
        </div>`;
    }

    function collaborationView() {
      return `
        <h2>Network alert discussion</h2>
        <p class="sub">Comments on Suspicious Network Traffic Detected. All four comment types are present.</p>
        ${comments.map((comment) => `<article class="card"><div class="row" style="justify-content:space-between"><strong>${escapeHtml(comment.who)}</strong><span class="tag plain">${comment.type}</span></div><div class="meta">${escapeHtml(comment.role)}</div><p>${escapeHtml(comment.text)}</p></article>`).join("")}
        <div class="card"><input placeholder="Add a comment"><div class="toolbar" style="margin-top:10px"><button class="tiny">Add note</button><button class="tiny">Escalate</button><button class="tiny">Ask question</button><button class="tiny">Mark resolved</button></div></div>`;
    }

    function metricsView() {
      return `
        <h2>KPI Metrics</h2>
        <p class="sub">Counts are computed from the synthetic rows. Detect time, response time, and the rates are the operational figures in the dataset.</p>
        <div class="kpis">${kpis.map(([name, current, previous, target, progress, category]) => `
          <article class="card"><div class="meta">${category.toUpperCase()}</div><strong>${name}</strong><div class="stat"><b>${current}</b></div><div class="meta">Previous ${previous} · Target ${target}</div><div class="bar"><span style="width:${progress}%"></span></div></article>`).join("")}</div>`;
    }

    function threatsView() {
      const rows = indicators.filter((item) => (state.indicatorType === "all" || item.type === state.indicatorType) && (state.country === "all" || item.country === state.country));
      const countries = [...new Set(indicators.map((item) => item.country))];
      const origins = {};
      indicators.forEach((item) => { origins[item.country] = (origins[item.country] || 0) + 1; });
      return `
        <h2>Global Threat Intelligence</h2>
        <p class="sub">${indicators.length} active indicators. One retired sinkhole is excluded, matching the live feed.</p>
        <div class="toolbar">
          <select id="indicator-type">${["all", "ip", "domain", "url", "hash", "email", "file"].map((type) => `<option ${state.indicatorType === type ? "selected" : ""}>${type}</option>`).join("")}</select>
          <select id="country"><option value="all">all countries</option>${countries.map((country) => `<option ${state.country === country ? "selected" : ""}>${country}</option>`).join("")}</select>
        </div>
        <div class="split">
          <div class="card"><strong>Threat origins</strong>${Object.entries(origins).map(([country, count]) => `<div class="row" style="justify-content:space-between"><span>${country}</span><span>${count}</span></div>`).join("")}</div>
          <div class="card"><strong>Latest indicators</strong>${rows.slice(0, 8).map((item) => `<div class="row" style="justify-content:space-between"><div><strong>${escapeHtml(item.value)}</strong><div class="meta">${escapeHtml(item.threat)} · ${item.country}</div></div><span class="tag ${item.confidence >= 90 ? "critical" : item.confidence >= 70 ? "high" : item.confidence >= 50 ? "medium" : "low"}">${item.confidence}%</span></div>`).join("")}</div>
        </div>
        <div class="card">
          <strong>Threat correlation</strong>
          <p class="meta">Ledger Fox controls the C2 address and the phishing domain. The domain hosts the invoice URL. The DDoS address is a separate chain.</p>
          <svg class="graph" viewBox="0 0 640 280">
            <line x1="210" y1="70" x2="120" y2="160" stroke="#f27a1a" stroke-width="2"/>
            <line x1="210" y1="70" x2="320" y2="160" stroke="#f27a1a" stroke-width="2"/>
            <line x1="320" y1="160" x2="460" y2="90" stroke="#e6b325" stroke-width="2"/>
            <line x1="500" y1="200" x2="580" y2="120" stroke="#f05252" stroke-width="2"/>
            ${node(210, 70, "Ledger Fox", "actor")}
            ${node(120, 160, "185.220.101.182", "ip")}
            ${node(320, 160, "pay-ledger.example", "domain")}
            ${node(460, 90, "invoice URL", "url")}
            ${node(500, 200, "botnet.example", "domain")}
            ${node(580, 120, "45.142.214.48", "ip")}
          </svg>
        </div>`;
    }

    function node(x, y, label, kind) {
      return `<g><rect x="${x - 70}" y="${y - 18}" width="140" height="36" rx="8" fill="#1b2430" stroke="#3a4658"/><text x="${x}" y="${y - 2}" text-anchor="middle" fill="#f2f4f7" font-size="11">${label}</text><text x="${x}" y="${y + 12}" text-anchor="middle" fill="#9aa3b2" font-size="10">${kind}</text></g>`;
    }

    function reportsView() {
      const templates = [
        { role: "management", name: "Executive Security Summary", text: "Security posture, open risk, and the incidents that need a management decision.", sections: ["Security Metrics", "Risk Assessment", "Budget Impact", "Strategic Recommendations"], status: "active", frequency: "Monthly" },
        { role: "management", name: "SOC Performance Dashboard", text: "Detection, response, resolution, and false-positive rates for management review.", sections: ["MTTD/MTTR Trends", "Team Performance", "False Positive Rates", "Escalation Analysis"], status: "draft", frequency: "Weekly" },
        { role: "tier3", name: "Incident Analysis Report", text: "Technical analysis of open and investigating incidents for Tier 3 analysts.", sections: ["Incident Timeline", "IOCs", "Attack Vectors", "Mitigation Steps"], status: "active", frequency: "Weekly" },
        { role: "tier3", name: "Threat Intelligence Summary", text: "Active indicators, origins, and the Ledger Fox correlation.", sections: ["New Threats", "TTPs Analysis", "Vulnerability Assessment", "Recommendations"], status: "active", frequency: "Daily" }
      ].filter((item) => item.role === state.reportRole);
      return `
        <h2>Report Generator</h2>
        <p class="sub">Templates and schedules are the synthetic report rows. Generating a report in the running app reads PostgreSQL and does not call a model.</p>
        <div class="tabs">
          ${["templates", "scheduled"].map((tab) => `<button class="ghost" aria-selected="${state.reportTab === tab}" data-report-tab="${tab}">${tab === "templates" ? "Report templates" : "Scheduled reports"}</button>`).join("")}
        </div>
        ${state.reportTab === "templates" ? `
          <div class="toolbar"><button class="${state.reportRole === "management" ? "primary" : "ghost"}" data-role="management">Management</button><button class="${state.reportRole === "tier3" ? "primary" : "ghost"}" data-role="tier3">Tier 3</button></div>
          <div class="split">${templates.map((item) => `<article class="card"><strong>${item.name}</strong><p>${item.text}</p><div>${item.sections.map((section) => `<span class="tag plain">${section}</span>`).join("")}</div><div class="meta">${item.frequency} · ${item.status}</div></article>`).join("")}</div>
        ` : `
          <article class="card"><strong>Executive Security Summary</strong><div class="meta">Monthly · active · next run in 14 days</div><div>ciso@soc.local</div><div>security-leads@soc.local</div></article>
          <article class="card"><strong>SOC Performance Dashboard</strong><div class="meta">Weekly · paused · next run in 3 days</div><div>soc-manager@soc.local</div></article>
        `}`;
    }

    function render() {
      const root = document.getElementById("app");
      if (!state.authed) {
        root.innerHTML = `
          <div class="auth"><form class="auth-card" id="auth-form">
            <div class="row"><div class="mark"></div><div class="brand">SoC-AI Portal</div></div>
            <p class="hint">Static mockup of the analyst workspace. Sign in with the demo account to open the screens.</p>
            <label>Email</label><input id="email" value="analyst@soc.local">
            <label>Password</label><input id="password" type="password" value="analyst123">
            <p class="error">${escapeHtml(state.authError)}</p>
            <button class="primary" type="submit">Sign in</button>
          </form></div>`;
        document.getElementById("auth-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          if (email === "analyst@soc.local" && password === "analyst123") {
            state.authed = true;
            state.authError = "";
          } else {
            state.authError = "Use analyst@soc.local and analyst123.";
          }
          render();
        });
        return;
      }
      const views = { alerts: alertsView, incidents: incidentsView, assistant: assistantView, collaboration: collaborationView, metrics: metricsView, threats: threatsView, reports: reportsView };
      root.innerHTML = shell(views[state.view]());
      root.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => { state.view = button.dataset.view; state.searchOpen = false; render(); }));
      root.querySelectorAll("[data-severity]").forEach((button) => button.addEventListener("click", () => { state.severity = button.dataset.severity; render(); }));
      root.querySelectorAll("[data-incident]").forEach((button) => button.addEventListener("click", () => { state.incidentId = button.dataset.incident; render(); }));
      const close = document.getElementById("close-detail");
      if (close) close.addEventListener("click", () => { state.incidentId = null; render(); });
      const search = document.getElementById("search");
      if (search) {
        search.addEventListener("input", () => { state.query = search.value; state.searchOpen = true; render(); document.getElementById("search").focus(); });
        const hits = searchHits();
        root.querySelectorAll("[data-hit]").forEach((button) => button.addEventListener("mousedown", (event) => {
          event.preventDefault();
          const hit = hits[Number(button.dataset.hit)];
          state.view = hit.view;
          state.searchOpen = false;
          if (hit.id) state.incidentId = hit.id;
          render();
        }));
      }
      const signout = document.getElementById("signout");
      if (signout) signout.addEventListener("click", () => { state.authed = false; render(); });
      const send = document.getElementById("send");
      if (send) send.addEventListener("click", () => {
        const text = document.getElementById("draft").value.trim();
        if (!text) return;
        const answer = routeQuestion(text);
        state.messages.push({ role: "user", text }, { role: "assistant", text: answer.text, path: answer.path });
        state.draft = "";
        render();
      });
      root.querySelectorAll("[data-report-tab]").forEach((button) => button.addEventListener("click", () => { state.reportTab = button.dataset.reportTab; render(); }));
      root.querySelectorAll("[data-role]").forEach((button) => button.addEventListener("click", () => { state.reportRole = button.dataset.role; render(); }));
      const typeSelect = document.getElementById("indicator-type");
      if (typeSelect) typeSelect.addEventListener("change", () => { state.indicatorType = typeSelect.value; render(); });
      const countrySelect = document.getElementById("country");
      if (countrySelect) countrySelect.addEventListener("change", () => { state.country = countrySelect.value; render(); });
    }

    render();
  </script>
</body>
</html>
